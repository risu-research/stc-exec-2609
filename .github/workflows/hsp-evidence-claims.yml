name: Civic public-data claim admissibility audit
on:
  push:
    branches: [main]
    paths:
      - 'research/municipal-evidence-gates/**'
      - '.github/workflows/hsp-evidence-claims.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen original evidence and claim boundaries
        run: python research/municipal-evidence-gates/src/claim_gate.py --root research/municipal-evidence-gates --out out/hsp-evidence-claim-ledger.json
      - name: Adversarial proof-obligation tests
        run: python -m unittest discover -s research/municipal-evidence-gates/tests -v
      - name: Preserve evidence-gate verdict
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsp-evidence-gate-ledger
          path: out/hsp-evidence-claim-ledger.json
          if-no-files-found: warn
          retention-days: 45
